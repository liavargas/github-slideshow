name: Daily Real Estate Report

on:
  schedule:
    # 7:00 AM ET (12:00 UTC winter / 11:00 UTC summer — using 12:00 to cover EST)
    - cron: '0 12 * * *'
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI for testing

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: mom-real-estate
        run: pip install -r requirements.txt

      - name: Run daily report
        working-directory: mom-real-estate
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python run.py
